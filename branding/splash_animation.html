<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorLink 500 - Splash Screen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #08081a;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
  }

  .splash {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── Background grid pattern ── */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0;
    animation: fadeIn 1s 0.3s forwards;
  }

  /* ── Ribbon canvas (SVG) ── */
  .ribbon-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  /* ── Logo text ── */
  .logo-text {
    position: relative;
    z-index: 5;
    text-align: center;
    pointer-events: none;
  }

  .logo-main {
    font-weight: 900;
    font-size: clamp(40px, 8vw, 80px);
    letter-spacing: 6px;
    opacity: 0;
    animation: textReveal 0.8s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    position: relative;
    display: inline-block;
  }

  .logo-main .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(30px) scale(0.8);
    animation: charPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    background: linear-gradient(180deg, #ffffff 0%, #ccccdd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-500 {
    font-weight: 700;
    font-size: clamp(28px, 5vw, 52px);
    letter-spacing: 16px;
    margin-top: 4px;
    opacity: 0;
    animation: num500Reveal 0.8s 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    background: linear-gradient(90deg, #FFD93B, #FF8C3B, #FF3B5C);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    font-size: clamp(8px, 1.2vw, 12px);
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #444;
    margin-top: 16px;
    opacity: 0;
    animation: fadeIn 0.8s 2.8s forwards;
  }

  /* ── Glow pulse behind text ── */
  .glow-pulse {
    position: absolute;
    width: 500px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(59,139,255,0.15) 0%, transparent 70%);
    z-index: 0;
    opacity: 0;
    animation: glowPulse 3s 1.5s ease-in-out infinite;
  }

  /* ── Floating dots decoration ── */
  .float-dot {
    position: absolute;
    border-radius: 50%;
    z-index: 2;
    opacity: 0;
  }

  /* ── Keyframes ── */
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @keyframes textReveal {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes charPop {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes num500Reveal {
    from { opacity: 0; letter-spacing: 40px; }
    to { opacity: 1; letter-spacing: 16px; }
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.2); }
  }

  @keyframes floatDot {
    0% { transform: translate(0, 0) scale(0); opacity: 0; }
    20% { opacity: 0.8; transform: scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }
</style>
</head>
<body>

<div class="splash">
  <div class="bg-grid"></div>
  <div class="glow-pulse"></div>

  <!-- Ribbon SVG layer -->
  <svg class="ribbon-layer" id="ribbonSvg" preserveAspectRatio="xMidYMid slice"></svg>

  <!-- Floating dots container -->
  <div id="dotsContainer"></div>

  <!-- Logo -->
  <div class="logo-text">
    <div class="logo-main" id="logoMain"></div>
    <div class="logo-500">500</div>
    <div class="tagline">Connect &middot; Solve &middot; Master</div>
  </div>
</div>

<script>
(function() {
  const COLORS = [
    { hex: '#FF3B5C', rgb: [255, 59, 92]  },   // Red
    { hex: '#FF8C3B', rgb: [255, 140, 59] },   // Orange
    { hex: '#FFD93B', rgb: [255, 217, 59] },   // Yellow
    { hex: '#3BFF8B', rgb: [59, 255, 139] },   // Green
    { hex: '#3BD4FF', rgb: [59, 212, 255] },   // Cyan
    { hex: '#3B8BFF', rgb: [59, 139, 255] },   // Blue
    { hex: '#7B3BFF', rgb: [123, 59, 255] },   // Violet
    { hex: '#C73BFF', rgb: [199, 59, 255] },   // Magenta
  ];

  const WORD = 'COLORLINK';

  // ── Character-by-character reveal ──
  const logoMain = document.getElementById('logoMain');
  WORD.split('').forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = ch;
    span.style.animationDelay = `${0.8 + i * 0.09}s`;
    logoMain.appendChild(span);
  });

  // ── Ribbon animation (SVG paths coming from sides) ──
  const svg = document.getElementById('ribbonSvg');
  const W = window.innerWidth;
  const H = window.innerHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // We'll create ribbons that come from left & right edges and
  // converge toward the center where the text is, weaving through the letters.
  const CX = W / 2;
  const CY = H / 2;

  // Each ribbon: starts off-screen, curves toward center text area
  const ribbonConfigs = [
    // From left side
    { startX: -80,  startY: CY - 60, color: COLORS[0], side: 'left',  yOffset: -40, delay: 0.2 },
    { startX: -80,  startY: CY - 15, color: COLORS[1], side: 'left',  yOffset: -10, delay: 0.35 },
    { startX: -80,  startY: CY + 20, color: COLORS[2], side: 'left',  yOffset: 15,  delay: 0.5 },
    { startX: -80,  startY: CY + 55, color: COLORS[3], side: 'left',  yOffset: 45,  delay: 0.65 },
    // From right side
    { startX: W+80, startY: CY - 50, color: COLORS[4], side: 'right', yOffset: -35, delay: 0.3 },
    { startX: W+80, startY: CY - 5,  color: COLORS[5], side: 'right', yOffset: 0,   delay: 0.45 },
    { startX: W+80, startY: CY + 35, color: COLORS[6], side: 'right', yOffset: 25,  delay: 0.6 },
    { startX: W+80, startY: CY + 65, color: COLORS[7], side: 'right', yOffset: 50,  delay: 0.75 },
  ];

  ribbonConfigs.forEach((cfg, idx) => {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

    // Build a cubic bezier from the edge to center, with wavy control points
    const endX = cfg.side === 'left' ? CX + 120 : CX - 120;
    const endY = CY + cfg.yOffset;

    const cp1x = cfg.side === 'left' ? CX * 0.3 : W - CX * 0.3;
    const cp1y = cfg.startY + (Math.random() - 0.5) * 80;
    const cp2x = cfg.side === 'left' ? CX * 0.7 : W - CX * 0.7 + CX;
    const cp2y = endY + (Math.random() - 0.5) * 60;

    const d = `M ${cfg.startX} ${cfg.startY} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endX} ${endY}`;

    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', cfg.color.hex);
    path.setAttribute('stroke-width', '6');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('opacity', '0.7');

    // Dash animation: draw the path over time
    const length = 2000; // approximate
    path.style.strokeDasharray = length;
    path.style.strokeDashoffset = length;
    path.style.filter = `drop-shadow(0 0 6px ${cfg.color.hex})`;
    path.style.transition = 'none';

    // Animate with delay
    path.style.animation = `drawRibbon 1.4s ${cfg.delay}s cubic-bezier(0.25, 0.1, 0.25, 1) forwards`;

    svg.appendChild(path);

    // Add endpoint dot at the end of ribbon
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', endX);
    dot.setAttribute('cy', endY);
    dot.setAttribute('r', '0');
    dot.setAttribute('fill', cfg.color.hex);
    dot.style.filter = `drop-shadow(0 0 8px ${cfg.color.hex})`;
    dot.style.animation = `dotAppear 0.4s ${cfg.delay + 1.2}s cubic-bezier(0.34, 1.56, 0.64, 1) forwards`;
    svg.appendChild(dot);
  });

  // Add ribbon animation keyframes dynamically
  const styleSheet = document.createElement('style');
  styleSheet.textContent = `
    @keyframes drawRibbon {
      to { stroke-dashoffset: 0; }
    }
    @keyframes dotAppear {
      to { r: 6; }
    }
    @keyframes shimmer {
      0% { opacity: 0.5; }
      50% { opacity: 0.9; }
      100% { opacity: 0.5; }
    }
  `;
  document.head.appendChild(styleSheet);

  // After ribbons arrive, add a gentle shimmer
  setTimeout(() => {
    svg.querySelectorAll('path').forEach(p => {
      p.style.animation = `shimmer 2.5s ${Math.random()}s ease-in-out infinite`;
    });
  }, 2500);

  // ── Floating dots (particles after ribbon arrival) ──
  const dotsContainer = document.getElementById('dotsContainer');

  function spawnDots() {
    for (let i = 0; i < 20; i++) {
      const dot = document.createElement('div');
      dot.className = 'float-dot';
      const c = COLORS[Math.floor(Math.random() * COLORS.length)];
      const size = 4 + Math.random() * 8;
      dot.style.width = size + 'px';
      dot.style.height = size + 'px';
      dot.style.background = c.hex;
      dot.style.boxShadow = `0 0 ${size}px ${c.hex}`;
      dot.style.left = (CX - 200 + Math.random() * 400) + 'px';
      dot.style.top = (CY - 60 + Math.random() * 120) + 'px';
      dot.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px');
      dot.style.setProperty('--dy', (Math.random() - 0.5) * 200 + 'px');
      dot.style.animation = `floatDot ${1.5 + Math.random() * 2}s ${Math.random() * 0.5}s ease-out forwards`;
      dotsContainer.appendChild(dot);
    }
  }

  setTimeout(spawnDots, 2000);
  setTimeout(spawnDots, 3500);

  // ── Second wave: thinner accent ribbons ──
  setTimeout(() => {
    const accentConfigs = [
      { startX: -40, startY: CY - 80, color: COLORS[5], side: 'left' },
      { startX: -40, startY: CY + 80, color: COLORS[2], side: 'left' },
      { startX: W+40, startY: CY - 70, color: COLORS[0], side: 'right' },
      { startX: W+40, startY: CY + 70, color: COLORS[7], side: 'right' },
    ];

    accentConfigs.forEach((cfg, i) => {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const endX = cfg.side === 'left' ? CX + 160 : CX - 160;
      const endY = CY + (Math.random() - 0.5) * 40;
      const cp1x = cfg.side === 'left' ? W * 0.25 : W * 0.75;
      const cp1y = cfg.startY + (Math.random() - 0.5) * 100;
      const cp2x = cfg.side === 'left' ? W * 0.55 : W * 0.45;
      const cp2y = endY + (Math.random() - 0.5) * 50;

      path.setAttribute('d', `M ${cfg.startX} ${cfg.startY} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endX} ${endY}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', cfg.color.hex);
      path.setAttribute('stroke-width', '3');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('opacity', '0.4');
      path.style.strokeDasharray = '2000';
      path.style.strokeDashoffset = '2000';
      path.style.filter = `drop-shadow(0 0 4px ${cfg.color.hex})`;
      path.style.animation = `drawRibbon 1.2s ${i * 0.15}s ease forwards`;
      svg.appendChild(path);
    });
  }, 1800);

})();
</script>

</body>
</html>
