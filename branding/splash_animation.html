<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorLink - Splash Screen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1e1e2a;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
  }

  .splash {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .logo-svg {
    position: relative;
    z-index: 2;
  }

  .wordmark {
    position: relative;
    z-index: 2;
    font-weight: 600;
    font-size: clamp(24px, 4vw, 40px);
    letter-spacing: 3px;
    color: #f0ece6;
    margin-top: 20px;
    opacity: 0;
  }
</style>
</head>
<body>

<div class="splash">
  <svg class="logo-svg" id="logoSvg" width="200" height="200" viewBox="0 0 512 512">
    <!-- 4 endpoint dots (appear first as the "puzzle") -->
    <circle id="dotC1" cx="270" cy="100" r="0" fill="#E8785E"/>
    <circle id="dotC2" cx="270" cy="410" r="0" fill="#E8785E"/>
    <circle id="dotL1" cx="330" cy="170" r="0" fill="#5B8FB9"/>
    <circle id="dotL2" cx="420" cy="370" r="0" fill="#5B8FB9"/>

    <!-- C path (rounded rectangular, open right) - drawn after dots -->
    <path id="pathC"
      d="M 270 100 L 150 100 Q 90 100, 90 160 L 90 350 Q 90 410, 150 410 L 270 410"
      stroke="#E8785E" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"
      stroke-dasharray="0" stroke-dashoffset="0" opacity="0"/>

    <!-- L path (separate, to the right of C) - drawn after C -->
    <path id="pathL"
      d="M 330 170 L 330 340 Q 330 370, 360 370 L 420 370"
      stroke="#5B8FB9" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"
      stroke-dasharray="0" stroke-dashoffset="0" opacity="0"/>
  </svg>

  <div class="wordmark" id="wordmark">ColorLink</div>
</div>

<script>
(function() {

  // ══════════════════════════════════════════
  //  WEB AUDIO - Warm, minimal
  // ══════════════════════════════════════════
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Soft sine pad
  function playPad(startTime, duration) {
    [174.61, 220, 261.63, 329.63].forEach(f => { // Fmaj7
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0, startTime);
      g.gain.linearRampToValueAtTime(0.02, startTime + 0.8);
      g.gain.setValueAtTime(0.02, startTime + duration - 1.2);
      g.gain.linearRampToValueAtTime(0, startTime + duration);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    });
  }

  // Soft dot "pop"
  function playPop(startTime, freq) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.7, startTime + 0.2);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.1, startTime);
    g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + 0.3);
  }

  // Path drawing tone
  function playDraw(startTime, duration, freq) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    osc.frequency.linearRampToValueAtTime(freq * 1.12, startTime + duration);
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1000;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(0.035, startTime + 0.12);
    g.gain.setValueAtTime(0.035, startTime + duration * 0.75);
    g.gain.linearRampToValueAtTime(0, startTime + duration);
    osc.connect(lp).connect(g).connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  // Completion pulse (gentle resolve)
  function playPulse(startTime) {
    [261.63, 329.63, 392, 523.25].forEach((f, i) => { // Cmaj
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0, startTime + i * 0.05);
      g.gain.linearRampToValueAtTime(0.04, startTime + i * 0.05 + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, startTime + 1.4);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 1.6);
    });
  }

  // ══════════════════════════════════════════
  //  ANIMATION TIMELINE (auto-start)
  // ══════════════════════════════════════════
  const t = audioCtx.currentTime + 0.3;

  // Schedule all sounds
  playPad(t, 4.5);

  // Dot pops (t+0.3 to t+0.9)
  playPop(t + 0.3, 440);    // C dot 1
  playPop(t + 0.55, 494);   // C dot 2
  playPop(t + 0.8, 523);    // L dot 1
  playPop(t + 1.0, 587);    // L dot 2

  // C path draw (t+1.3)
  playDraw(t + 1.3, 1.0, 349);

  // L path draw (t+2.0)
  playDraw(t + 2.0, 0.7, 392);

  // Completion pulse (t+2.9)
  playPulse(t + 2.9);

  // ── Visual sequence ──
  const dotC1 = document.getElementById('dotC1');
  const dotC2 = document.getElementById('dotC2');
  const dotL1 = document.getElementById('dotL1');
  const dotL2 = document.getElementById('dotL2');
  const pathC = document.getElementById('pathC');
  const pathL = document.getElementById('pathL');
  const wordmark = document.getElementById('wordmark');

  // Utility: animate dot radius with spring
  function popDot(el, targetR, delay) {
    setTimeout(() => {
      el.style.transition = `r 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)`;
      el.setAttribute('r', targetR);
    }, delay);
  }

  // Utility: draw path
  function drawPath(el, delay, duration) {
    // Measure real length
    const len = el.getTotalLength();
    el.setAttribute('stroke-dasharray', len);
    el.setAttribute('stroke-dashoffset', len);
    el.setAttribute('opacity', '1');

    setTimeout(() => {
      el.style.transition = `stroke-dashoffset ${duration}ms cubic-bezier(0.4, 0, 0.2, 1)`;
      el.setAttribute('stroke-dashoffset', '0');
    }, delay);
  }

  // PHASE 1: Dots appear (like puzzle clues being placed)
  popDot(dotC1, 32, 300);    // C endpoint 1
  popDot(dotC2, 32, 550);    // C endpoint 2
  popDot(dotL1, 24, 800);    // L endpoint 1
  popDot(dotL2, 24, 1000);   // L endpoint 2

  // PHASE 2: C path draws (connecting its dots)
  drawPath(pathC, 1300, 1000);

  // PHASE 3: L path draws (connecting its dots)
  drawPath(pathL, 2000, 700);

  // PHASE 4: Completion pulse - dots briefly scale up then settle
  setTimeout(() => {
    [dotC1, dotC2, dotL1, dotL2].forEach((d, i) => {
      const baseR = i < 2 ? 32 : 24;
      const pulseR = i < 2 ? 38 : 29;

      d.style.transition = 'r 0.2s ease-out';
      d.setAttribute('r', pulseR);

      setTimeout(() => {
        d.style.transition = 'r 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
        d.setAttribute('r', baseR);
      }, 200);
    });
  }, 2900);

  // PHASE 5: Wordmark fades in, then everything is static
  setTimeout(() => {
    wordmark.style.transition = 'opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
    wordmark.style.opacity = '1';
    wordmark.style.transform = 'translateY(0)';
  }, 3200);

})();
</script>

</body>
</html>
