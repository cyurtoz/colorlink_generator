<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorLink 500 - Splash Screen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1e1e2a;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
  }

  .splash {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .start-prompt {
    position: absolute;
    z-index: 100;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 3px;
    color: #666;
    text-transform: lowercase;
    animation: gentlePulse 2s ease-in-out infinite;
  }

  @keyframes gentlePulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* ── Path drawing layer ── */
  .path-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  /* ── Logo (appears after paths connect) ── */
  .logo-wrap {
    position: relative;
    z-index: 5;
    text-align: center;
    opacity: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .logo-name {
    font-weight: 600;
    font-size: clamp(32px, 6vw, 56px);
    letter-spacing: 3px;
    color: #f0ece6;
    opacity: 0;
    transform: translateY(12px);
  }

  .logo-sub {
    font-weight: 300;
    font-size: clamp(11px, 1.5vw, 15px);
    letter-spacing: 6px;
    color: #555;
    opacity: 0;
  }
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="start-prompt" id="startPrompt">tap to begin</div>
  <svg class="path-layer" id="pathSvg" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="logo-wrap" id="logoWrap">
    <div class="logo-name" id="logoName">ColorLink</div>
    <div class="logo-sub" id="logoSub">500 PUZZLES</div>
  </div>
</div>

<script>
(function() {

  /*
   * WARM PALETTE (muted, calm):
   *   Coral:  #E8785E
   *   Ocean:  #5B8FB9
   *   Sage:   #6BAA75
   */
  const PATHS = [
    { color: '#E8785E', dotR: 10 },  // coral
    { color: '#5B8FB9', dotR: 10 },  // ocean
    { color: '#6BAA75', dotR: 9  },  // sage
  ];

  // ══════════════════════════════════════════
  //  WEB AUDIO - Warm, gentle, satisfying
  // ══════════════════════════════════════════
  let audioCtx;

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  // Soft sine pad (warm ambient bed)
  function playWarmPad(startTime, duration) {
    const freqs = [174.61, 220, 261.63, 329.63]; // F3, A3, C4, E4 = Fmaj7
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(0.025, startTime + 0.8);
      gain.gain.setValueAtTime(0.025, startTime + duration - 1);
      gain.gain.linearRampToValueAtTime(0, startTime + duration);

      osc.connect(gain).connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    });
  }

  // Gentle "drawing" tone (path being traced)
  function playDrawTone(startTime, duration, freq, panVal) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    osc.frequency.linearRampToValueAtTime(freq * 1.15, startTime + duration);

    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1200;
    lp.Q.value = 1;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.04, startTime + 0.15);
    gain.gain.setValueAtTime(0.04, startTime + duration * 0.7);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);

    const panner = audioCtx.createStereoPanner();
    panner.pan.value = panVal;

    osc.connect(lp).connect(gain).connect(panner).connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  // Soft "click" when dot endpoint lands
  function playSoftClick(startTime, freq) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.8, startTime + 0.2);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.08, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);

    osc.connect(gain).connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + 0.3);
  }

  // Final gentle "resolve" chord when logo appears
  function playResolve(startTime) {
    const freqs = [261.63, 329.63, 392, 523.25]; // C4, E4, G4, C5 = Cmaj
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, startTime + i * 0.06);
      gain.gain.linearRampToValueAtTime(0.04, startTime + i * 0.06 + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 1.5);

      osc.connect(gain).connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 1.8);
    });
  }

  function playAllSounds() {
    const t = audioCtx.currentTime + 0.05;

    // Ambient bed (whole duration)
    playWarmPad(t, 4.5);

    // Path 1 draws (coral) - from left
    playDrawTone(t + 0.2, 1.0, 349.23, -0.3);  // F4
    playSoftClick(t + 0.2, 440);                  // start dot
    playSoftClick(t + 1.15, 523.25);              // end dot

    // Path 2 draws (ocean) - from right
    playDrawTone(t + 0.6, 1.0, 392, 0.3);        // G4
    playSoftClick(t + 0.6, 466.16);               // start dot
    playSoftClick(t + 1.55, 554.37);              // end dot

    // Path 3 draws (sage) - center
    playDrawTone(t + 1.0, 0.8, 440, 0);          // A4
    playSoftClick(t + 1.0, 493.88);               // start dot
    playSoftClick(t + 1.75, 587.33);              // end dot

    // Logo resolve
    playResolve(t + 2.2);
  }

  // ══════════════════════════════════════════
  //  VISUAL ANIMATION
  // ══════════════════════════════════════════
  function startAnimation() {
    document.getElementById('startPrompt').style.display = 'none';

    const svg = document.getElementById('pathSvg');
    const W = window.innerWidth;
    const H = window.innerHeight;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    const CX = W / 2;
    const CY = H / 2;

    // Three paths that converge toward center, each with an L-turn
    // Like actual gameplay: dot → path with corner → dot
    const pathDefs = [
      {
        // Coral: enters from upper-left, turns right toward center
        points: [
          { x: CX - 180, y: CY - 80 },                    // start dot
          { x: CX - 180, y: CY + 20 },                    // vertical down
          { x: CX - 40,  y: CY + 20 },                    // horizontal right (end)
        ],
        color: '#E8785E',
        delay: 200,
        duration: 1000,
      },
      {
        // Ocean: enters from upper-right, turns left toward center
        points: [
          { x: CX + 160, y: CY - 70 },                    // start dot
          { x: CX + 160, y: CY - 10 },                    // vertical down
          { x: CX + 30,  y: CY - 10 },                    // horizontal left (end)
        ],
        color: '#5B8FB9',
        delay: 600,
        duration: 1000,
      },
      {
        // Sage: enters from bottom-center, turns right
        points: [
          { x: CX - 60,  y: CY + 90 },                    // start dot
          { x: CX - 60,  y: CY + 50 },                    // vertical up
          { x: CX + 80,  y: CY + 50 },                    // horizontal right (end)
        ],
        color: '#6BAA75',
        delay: 1000,
        duration: 800,
      },
    ];

    pathDefs.forEach((pd) => {
      const pts = pd.points;

      // Build SVG path with rounded corner
      const midX = pts[0].x;
      const midY = pts[1].y;
      const r = 12; // corner radius

      // Determine corner direction
      const goingDown = pts[1].y > pts[0].y;
      const goingRight = pts[2].x > pts[1].x;

      let d;
      if (goingDown && goingRight) {
        d = `M ${pts[0].x} ${pts[0].y} L ${pts[0].x} ${pts[1].y - r} Q ${pts[0].x} ${pts[1].y}, ${pts[0].x + r} ${pts[1].y} L ${pts[2].x} ${pts[2].y}`;
      } else if (goingDown && !goingRight) {
        d = `M ${pts[0].x} ${pts[0].y} L ${pts[0].x} ${pts[1].y - r} Q ${pts[0].x} ${pts[1].y}, ${pts[0].x - r} ${pts[1].y} L ${pts[2].x} ${pts[2].y}`;
      } else if (!goingDown && goingRight) {
        d = `M ${pts[0].x} ${pts[0].y} L ${pts[0].x} ${pts[1].y + r} Q ${pts[0].x} ${pts[1].y}, ${pts[0].x + r} ${pts[1].y} L ${pts[2].x} ${pts[2].y}`;
      } else {
        d = `M ${pts[0].x} ${pts[0].y} L ${pts[0].x} ${pts[1].y + r} Q ${pts[0].x} ${pts[1].y}, ${pts[0].x - r} ${pts[1].y} L ${pts[2].x} ${pts[2].y}`;
      }

      // Create path element
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', pd.color);
      path.setAttribute('stroke-width', '6');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');

      const pathLength = path.getTotalLength ? path.getTotalLength() : 600;
      path.style.strokeDasharray = pathLength;
      path.style.strokeDashoffset = pathLength;

      svg.appendChild(path);

      // Start dot (appears first)
      const dot1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot1.setAttribute('cx', pts[0].x);
      dot1.setAttribute('cy', pts[0].y);
      dot1.setAttribute('r', '0');
      dot1.setAttribute('fill', pd.color);
      svg.appendChild(dot1);

      // End dot (appears when path arrives)
      const dot2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot2.setAttribute('cx', pts[2].x);
      dot2.setAttribute('cy', pts[2].y);
      dot2.setAttribute('r', '0');
      dot2.setAttribute('fill', pd.color);
      svg.appendChild(dot2);

      // Animate with timeouts (clean, no loops)
      setTimeout(() => {
        // Start dot pops in
        dot1.style.transition = 'r 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)';
        dot1.setAttribute('r', '8');

        // Path draws
        path.style.transition = `stroke-dashoffset ${pd.duration}ms cubic-bezier(0.4, 0, 0.2, 1)`;
        path.style.strokeDashoffset = '0';

        // End dot appears when path finishes
        setTimeout(() => {
          dot2.style.transition = 'r 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)';
          dot2.setAttribute('r', '8');
        }, pd.duration - 50);
      }, pd.delay);
    });

    // Logo appears after all paths are done (clean fade, then static)
    setTimeout(() => {
      const logoWrap = document.getElementById('logoWrap');
      const logoName = document.getElementById('logoName');
      const logoSub = document.getElementById('logoSub');

      logoWrap.style.transition = 'opacity 0.5s ease';
      logoWrap.style.opacity = '1';

      logoName.style.transition = 'opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
      logoName.style.opacity = '1';
      logoName.style.transform = 'translateY(0)';

      setTimeout(() => {
        logoSub.style.transition = 'opacity 0.5s ease';
        logoSub.style.opacity = '1';
      }, 300);
    }, 2200);
  }

  // ══════════════════════════════════════════
  //  START ON CLICK/TAP
  // ══════════════════════════════════════════
  let started = false;
  document.getElementById('splash').addEventListener('click', () => {
    if (started) return;
    started = true;
    initAudio();
    playAllSounds();
    startAnimation();
  });

})();
</script>

</body>
</html>
