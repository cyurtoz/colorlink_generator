<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#1e1e2a"/>

  <!-- C: rounded rectangular open shape (open on right) -->
  <path d="M 310 90 L 155 90 Q 80 90, 80 165 L 80 345 Q 80 420, 155 420 L 310 420"
    stroke="#E8785E" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="310" cy="90" r="32" fill="#E8785E"/>
  <circle cx="310" cy="420" r="32" fill="#E8785E"/>

  <!-- L: embedded inside C, clear gap, ~70% weight -->
  <path d="M 200 175 L 200 330 Q 200 355, 225 355 L 280 355"
    stroke="#5B8FB9" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="200" cy="175" r="24" fill="#5B8FB9"/>
  <circle cx="280" cy="355" r="24" fill="#5B8FB9"/>
</svg>
