<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#1e1e2a"/>

  <!-- C: rounded rectangular open shape (open on right) -->
  <path d="M 310 90 L 155 90 Q 80 90, 80 165 L 80 345 Q 80 420, 155 420 L 310 420"
    stroke="#E8785E" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="310" cy="90" r="32" fill="#E8785E"/>
  <circle cx="310" cy="420" r="32" fill="#E8785E"/>

  <!--
    L inside C — equal 42px edge-to-edge gap on left and bottom:
    Left:   L_x=158.  (158-17) - (80+19) = 42
    Bottom: L_y=342.  (420-19) - (342+17) = 42
    Bottom extended to x=305 to avoid endpoint crowding.
  -->
  <path d="M 158 175 L 158 312 Q 158 342, 188 342 L 305 342"
    stroke="#5B8FB9" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="158" cy="175" r="29" fill="#5B8FB9"/>
  <circle cx="305" cy="342" r="29" fill="#5B8FB9"/>
</svg>
