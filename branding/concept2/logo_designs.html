<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorLink 500 - Concept 2: Retro 80s Logo Designs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Bungee+Shade&family=Russo+One&family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    gap: 100px;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: -60px;
  }

  .design-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #444;
    margin-bottom: -60px;
  }

  /* ===================== DESIGN 1: Retro Adidas Stripes ===================== */
  .retro-stripes-container {
    width: 600px;
    height: 340px;
    background: linear-gradient(180deg, #0f0f23 0%, #16213e 100%);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 2px solid #222;
  }

  /* Three diagonal stripes (adidas-inspired) */
  .stripe {
    position: absolute;
    width: 200%;
    height: 14px;
    transform: rotate(-25deg);
    transform-origin: center;
  }
  .stripe-1 { background: #FF6B9D; top: 70px; left: -50%; opacity: 0.7; }
  .stripe-2 { background: #C44DFF; top: 100px; left: -50%; opacity: 0.6; }
  .stripe-3 { background: #4DCCFF; top: 130px; left: -50%; opacity: 0.5; }

  /* Bottom stripes */
  .stripe-4 { background: #FF6B9D; bottom: 120px; left: -50%; opacity: 0.5; transform: rotate(25deg); }
  .stripe-5 { background: #C44DFF; bottom: 90px; left: -50%; opacity: 0.4; transform: rotate(25deg); }
  .stripe-6 { background: #4DCCFF; bottom: 60px; left: -50%; opacity: 0.3; transform: rotate(25deg); }

  .retro-title-1 {
    font-family: 'Righteous', cursive;
    font-size: 64px;
    letter-spacing: 4px;
    position: relative;
    z-index: 2;
    color: #fff;
    text-shadow:
      3px 3px 0 #FF6B9D,
      6px 6px 0 #C44DFF,
      9px 9px 0 #4DCCFF;
  }

  .retro-500-1 {
    font-family: 'Righteous', cursive;
    font-size: 48px;
    letter-spacing: 20px;
    position: relative;
    z-index: 2;
    color: #FFE156;
    text-shadow:
      2px 2px 0 #FF8C00,
      4px 4px 0 rgba(255,140,0,0.4);
    margin-top: -4px;
  }

  .retro-tagline {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    letter-spacing: 6px;
    color: #FF6B9D;
    margin-top: 12px;
    position: relative;
    z-index: 2;
  }

  /* ===================== DESIGN 2: Sunset Chrome ===================== */
  .sunset-container {
    width: 600px;
    height: 360px;
    background: linear-gradient(180deg, #0a0a2e 0%, #16082e 40%, #2d1b4e 70%, #1a0a2e 100%);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 2px solid #333;
  }

  /* Sunset / horizon */
  .sunset-circle {
    position: absolute;
    bottom: 60px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: linear-gradient(180deg,
      #FF6B9D 0%,
      #FF4D6D 20%,
      #C44DFF 40%,
      #6B2FA0 60%,
      transparent 60%
    );
    opacity: 0.5;
    mask-image: linear-gradient(180deg, white 50%, transparent 50%);
    -webkit-mask-image: linear-gradient(180deg, white 50%, transparent 50%);
  }

  /* Horizontal scan lines over sun */
  .scan-lines {
    position: absolute;
    bottom: 60px;
    width: 300px;
    height: 150px;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 4px,
      #0a0a2e 4px,
      #0a0a2e 7px
    );
    opacity: 0.8;
  }

  /* Perspective grid floor */
  .grid-floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100px;
    background:
      linear-gradient(90deg,
        transparent 0%, rgba(196,77,255,0.15) 10%, transparent 10.5%,
        transparent 20%, rgba(196,77,255,0.15) 20%, transparent 20.5%,
        transparent 30%, rgba(196,77,255,0.15) 30%, transparent 30.5%,
        transparent 40%, rgba(196,77,255,0.15) 40%, transparent 40.5%,
        transparent 50%, rgba(196,77,255,0.2) 50%, transparent 50.5%,
        transparent 60%, rgba(196,77,255,0.15) 60%, transparent 60.5%,
        transparent 70%, rgba(196,77,255,0.15) 70%, transparent 70.5%,
        transparent 80%, rgba(196,77,255,0.15) 80%, transparent 80.5%,
        transparent 90%, rgba(196,77,255,0.15) 90%, transparent 90.5%
      ),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 18px,
        rgba(196,77,255,0.12) 18px,
        rgba(196,77,255,0.12) 19px
      );
    transform: perspective(200px) rotateX(40deg);
    transform-origin: bottom;
  }

  .sunset-title {
    font-family: 'Righteous', cursive;
    font-size: 68px;
    letter-spacing: 3px;
    position: relative;
    z-index: 2;
    background: linear-gradient(180deg, #FFE156 0%, #FF6B9D 50%, #C44DFF 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(255,107,157,0.4));
  }

  .sunset-500 {
    font-family: 'Righteous', cursive;
    font-size: 44px;
    letter-spacing: 24px;
    position: relative;
    z-index: 2;
    background: linear-gradient(180deg, #4DCCFF 0%, #C44DFF 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-top: 0;
  }

  /* ===================== DESIGN 3: VHS / Glitch ===================== */
  .vhs-container {
    width: 600px;
    height: 320px;
    background: #0a0a0a;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 3px solid #333;
  }

  .vhs-noise {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.015) 2px,
      rgba(255,255,255,0.015) 4px
    );
    z-index: 10;
    pointer-events: none;
  }

  .vhs-title {
    font-family: 'Russo One', sans-serif;
    font-size: 72px;
    letter-spacing: 6px;
    position: relative;
    z-index: 2;
    color: #fff;
  }

  /* RGB split / chromatic aberration */
  .vhs-title::before,
  .vhs-title::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .vhs-title::before {
    color: #FF6B9D;
    z-index: -1;
    transform: translate(-3px, -2px);
    mix-blend-mode: screen;
    opacity: 0.8;
  }

  .vhs-title::after {
    color: #4DCCFF;
    z-index: -1;
    transform: translate(3px, 2px);
    mix-blend-mode: screen;
    opacity: 0.8;
  }

  .vhs-500 {
    font-family: 'Russo One', sans-serif;
    font-size: 50px;
    letter-spacing: 18px;
    color: #FFE156;
    position: relative;
    z-index: 2;
    text-shadow: 0 0 20px rgba(255,225,86,0.5);
  }

  .vhs-rec {
    position: absolute;
    top: 16px;
    left: 20px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #FF3B5C;
    z-index: 11;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vhs-rec-dot {
    width: 8px;
    height: 8px;
    background: #FF3B5C;
    border-radius: 50%;
    animation: recBlink 1s infinite;
  }

  @keyframes recBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .vhs-date {
    position: absolute;
    bottom: 16px;
    right: 20px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: #aaa;
    z-index: 11;
  }

  /* ===================== DESIGN 4: Trefoil / Athletic ===================== */
  .athletic-container {
    width: 500px;
    height: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  /* Trefoil-inspired icon using overlapping circles */
  .trefoil {
    position: relative;
    width: 120px;
    height: 100px;
  }

  .trefoil-leaf {
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    opacity: 0.8;
  }

  .trefoil-leaf:nth-child(1) { background: #FF6B9D; top: 0; left: 35px; }
  .trefoil-leaf:nth-child(2) { background: #4DCCFF; bottom: 10px; left: 8px; }
  .trefoil-leaf:nth-child(3) { background: #FFE156; bottom: 10px; right: 8px; }

  .trefoil-center {
    position: absolute;
    width: 24px;
    height: 24px;
    background: #fff;
    border-radius: 50%;
    top: 34px;
    left: 48px;
  }

  /* Three stripes under trefoil */
  .three-stripes {
    display: flex;
    gap: 6px;
    margin-top: -10px;
  }

  .three-stripes div {
    width: 28px;
    height: 60px;
    border-radius: 0 0 6px 6px;
  }

  .three-stripes div:nth-child(1) { background: #FF6B9D; }
  .three-stripes div:nth-child(2) { background: #C44DFF; }
  .three-stripes div:nth-child(3) { background: #4DCCFF; }

  .athletic-title {
    font-family: 'Righteous', cursive;
    font-size: 56px;
    letter-spacing: 5px;
    color: #fff;
    text-align: center;
  }

  .athletic-500 {
    font-family: 'Righteous', cursive;
    font-size: 36px;
    letter-spacing: 14px;
    color: #FFE156;
    margin-top: -8px;
  }

  .athletic-sub {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    letter-spacing: 5px;
    color: #666;
    text-transform: uppercase;
    margin-top: -6px;
  }
</style>
</head>
<body>

<h1>Concept 2 - Retro 80s / Athletic</h1>

<!-- ==================== DESIGN 1: Retro Adidas Stripes ==================== -->
<p class="design-label">Design 1 - Retro Stripes</p>
<div class="retro-stripes-container">
  <div class="stripe stripe-1"></div>
  <div class="stripe stripe-2"></div>
  <div class="stripe stripe-3"></div>
  <div class="stripe stripe-4"></div>
  <div class="stripe stripe-5"></div>
  <div class="stripe stripe-6"></div>
  <div class="retro-title-1">COLORLINK</div>
  <div class="retro-500-1">500</div>
  <div class="retro-tagline">Connect the colors</div>
</div>

<!-- ==================== DESIGN 2: Sunset Chrome ==================== -->
<p class="design-label">Design 2 - Sunset Chrome</p>
<div class="sunset-container">
  <div class="sunset-circle"></div>
  <div class="scan-lines"></div>
  <div class="grid-floor"></div>
  <div class="sunset-title">COLORLINK</div>
  <div class="sunset-500">500</div>
</div>

<!-- ==================== DESIGN 3: VHS / Glitch ==================== -->
<p class="design-label">Design 3 - VHS Glitch</p>
<div class="vhs-container">
  <div class="vhs-noise"></div>
  <div class="vhs-rec"><div class="vhs-rec-dot"></div> REC</div>
  <div class="vhs-title" data-text="COLORLINK">COLORLINK</div>
  <div class="vhs-500">500</div>
  <div class="vhs-date">1985.08.25</div>
</div>

<!-- ==================== DESIGN 4: Trefoil / Athletic ==================== -->
<p class="design-label">Design 4 - Athletic Trefoil</p>
<div class="athletic-container">
  <div class="trefoil">
    <div class="trefoil-leaf"></div>
    <div class="trefoil-leaf"></div>
    <div class="trefoil-leaf"></div>
    <div class="trefoil-center"></div>
  </div>
  <div class="three-stripes">
    <div></div>
    <div></div>
    <div></div>
  </div>
  <div class="athletic-title">COLORLINK</div>
  <div class="athletic-500">500</div>
  <div class="athletic-sub">Puzzle Athletics &middot; Est. 1985</div>
</div>

</body>
</html>
