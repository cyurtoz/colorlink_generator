<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorLink 500 - Logo Designs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    gap: 80px;
  }

  h1 {
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: -40px;
  }

  .design-label {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #444;
    margin-bottom: -50px;
  }

  /* ===================== DESIGN 1: Grid Logo ===================== */
  .logo-grid-container {
    position: relative;
    width: 500px;
    height: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .logo-grid {
    display: grid;
    grid-template-columns: repeat(5, 44px);
    grid-template-rows: repeat(3, 44px);
    gap: 4px;
    margin-bottom: 20px;
  }

  .grid-cell {
    width: 44px;
    height: 44px;
    border-radius: 6px;
    background: #151530;
    position: relative;
  }

  .grid-cell.dot::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .grid-cell.path-h::after {
    content: '';
    position: absolute;
    height: 10px;
    width: 100%;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    border-radius: 5px;
  }

  .grid-cell.path-v::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 100%;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    border-radius: 5px;
  }

  .grid-cell.path-corner-br::after {
    content: '';
    position: absolute;
    width: 32px;
    height: 32px;
    bottom: -2px;
    right: -2px;
    border: 5px solid;
    border-top: none;
    border-left: none;
    border-radius: 0 0 14px 0;
    background: transparent;
  }

  .grid-cell.path-corner-bl::after {
    content: '';
    position: absolute;
    width: 32px;
    height: 32px;
    bottom: -2px;
    left: -2px;
    border: 5px solid;
    border-top: none;
    border-right: none;
    border-radius: 0 0 0 14px;
    background: transparent;
  }

  .grid-cell.path-corner-tr::after {
    content: '';
    position: absolute;
    width: 32px;
    height: 32px;
    top: -2px;
    right: -2px;
    border: 5px solid;
    border-bottom: none;
    border-left: none;
    border-radius: 0 14px 0 0;
    background: transparent;
  }

  .grid-cell.path-corner-tl::after {
    content: '';
    position: absolute;
    width: 32px;
    height: 32px;
    top: -2px;
    left: -2px;
    border: 5px solid;
    border-bottom: none;
    border-right: none;
    border-radius: 14px 0 0 0;
    background: transparent;
  }

  /* Colors */
  .c-red .grid-cell.dot::after { background: #FF3B5C; }
  .c-red .grid-cell.path-h::after { background: #FF3B5C; }
  .c-red .grid-cell.path-v::after { background: #FF3B5C; }
  .c-red .grid-cell.path-corner-br::after,
  .c-red .grid-cell.path-corner-bl::after,
  .c-red .grid-cell.path-corner-tr::after,
  .c-red .grid-cell.path-corner-tl::after { border-color: #FF3B5C; }

  .c-blue .grid-cell.dot::after { background: #3B8BFF; }
  .c-blue .grid-cell.path-h::after { background: #3B8BFF; }
  .c-blue .grid-cell.path-v::after { background: #3B8BFF; }

  .c-green .grid-cell.dot::after { background: #3BFF8B; }
  .c-green .grid-cell.path-h::after { background: #3BFF8B; }
  .c-green .grid-cell.path-v::after { background: #3BFF8B; }
  .c-green .grid-cell.path-corner-br::after,
  .c-green .grid-cell.path-corner-bl::after,
  .c-green .grid-cell.path-corner-tr::after,
  .c-green .grid-cell.path-corner-tl::after { border-color: #3BFF8B; }

  .c-yellow .grid-cell.dot::after { background: #FFD93B; }
  .c-yellow .grid-cell.path-h::after { background: #FFD93B; }

  .logo-title-1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 48px;
    letter-spacing: 6px;
    background: linear-gradient(135deg, #FF3B5C, #FFD93B, #3BFF8B, #3B8BFF, #C73BFF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-title-1 .five-hundred {
    font-size: 32px;
    font-weight: 700;
    vertical-align: super;
    letter-spacing: 2px;
  }

  /* ===================== DESIGN 2: Neon Lines ===================== */
  .logo-neon-container {
    position: relative;
    width: 560px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .neon-bg {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a1a 70%);
    border-radius: 20px;
    border: 1px solid #222;
  }

  .logo-title-2 {
    position: relative;
    z-index: 1;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 56px;
    letter-spacing: 8px;
    color: #fff;
    text-shadow:
      0 0 10px rgba(255, 59, 92, 0.8),
      0 0 30px rgba(255, 59, 92, 0.4),
      0 0 60px rgba(59, 139, 255, 0.3);
  }

  .logo-title-2 .color-part { color: #FF3B5C; }
  .logo-title-2 .link-part { color: #3B8BFF; }
  .logo-title-2 .num-part {
    font-size: 36px;
    color: #FFD93B;
    text-shadow:
      0 0 10px rgba(255, 217, 59, 0.8),
      0 0 30px rgba(255, 217, 59, 0.4);
    margin-left: 8px;
  }

  /* Decorative neon lines */
  .neon-line {
    position: absolute;
    border-radius: 4px;
    z-index: 0;
  }

  .neon-line-1 {
    width: 120px; height: 4px;
    background: #FF3B5C;
    box-shadow: 0 0 8px #FF3B5C, 0 0 20px rgba(255,59,92,0.5);
    top: 30px; left: 40px;
    transform: rotate(-5deg);
  }

  .neon-line-2 {
    width: 80px; height: 4px;
    background: #3BFF8B;
    box-shadow: 0 0 8px #3BFF8B, 0 0 20px rgba(59,255,139,0.5);
    bottom: 35px; right: 50px;
    transform: rotate(8deg);
  }

  .neon-line-3 {
    width: 4px; height: 60px;
    background: #3B8BFF;
    box-shadow: 0 0 8px #3B8BFF, 0 0 20px rgba(59,139,255,0.5);
    top: 40px; right: 30px;
    transform: rotate(15deg);
  }

  .neon-line-4 {
    width: 4px; height: 50px;
    background: #FFD93B;
    box-shadow: 0 0 8px #FFD93B, 0 0 20px rgba(255,217,59,0.5);
    bottom: 30px; left: 30px;
    transform: rotate(-10deg);
  }

  .neon-dot {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    z-index: 0;
  }

  .neon-dot-1 { background: #FF3B5C; box-shadow: 0 0 12px #FF3B5C; top: 28px; left: 155px; }
  .neon-dot-2 { background: #3BFF8B; box-shadow: 0 0 12px #3BFF8B; bottom: 33px; right: 125px; }
  .neon-dot-3 { background: #C73BFF; box-shadow: 0 0 12px #C73BFF; top: 60px; left: 60px; }
  .neon-dot-4 { background: #3B8BFF; box-shadow: 0 0 12px #3B8BFF; bottom: 50px; left: 100px; }

  /* ===================== DESIGN 3: Minimal Geometric ===================== */
  .logo-minimal-container {
    width: 500px;
    height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .logo-icon-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }

  .logo-icon-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
  }

  .logo-icon-line {
    width: 40px;
    height: 4px;
    border-radius: 2px;
    align-self: center;
  }

  .logo-title-3 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 52px;
    letter-spacing: 4px;
    color: #ffffff;
  }

  .logo-title-3 .c1 { color: #FF3B5C; }
  .logo-title-3 .c2 { color: #FF8C3B; }
  .logo-title-3 .c3 { color: #FFD93B; }
  .logo-title-3 .c4 { color: #3BFF8B; }
  .logo-title-3 .c5 { color: #3BD4FF; }
  .logo-title-3 .c6 { color: #3B8BFF; }
  .logo-title-3 .c7 { color: #7B3BFF; }
  .logo-title-3 .c8 { color: #C73BFF; }

  .logo-subtitle-3 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 40px;
    letter-spacing: 16px;
    background: linear-gradient(90deg, #FFD93B, #FF8C3B);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    font-size: 10px;
    letter-spacing: 8px;
    color: #555;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ===================== DESIGN 4: Connected Paths Logo ===================== */
  .logo-paths-container {
    width: 520px;
    height: 280px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .logo-paths-svg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .logo-title-4 {
    position: relative;
    z-index: 1;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 54px;
    letter-spacing: 5px;
    text-align: center;
  }

  .logo-title-4 .top-line {
    display: block;
    background: linear-gradient(90deg, #FF3B5C, #FF8C3B, #FFD93B);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-title-4 .bottom-line {
    display: block;
    font-size: 38px;
    letter-spacing: 14px;
    background: linear-gradient(90deg, #3BFF8B, #3BD4FF, #3B8BFF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .sep-line {
    width: 280px;
    height: 3px;
    background: linear-gradient(90deg, #FF3B5C, #FFD93B, #3BFF8B, #3B8BFF, #C73BFF);
    border-radius: 2px;
    margin: 8px 0;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

<h1>ColorLink 500 - Logo Design Options</h1>

<!-- ==================== DESIGN 1 ==================== -->
<p class="design-label">Design 1 - Puzzle Grid</p>
<div class="logo-grid-container">
  <div class="logo-grid">
    <!-- Row 1 -->
    <div class="grid-cell c-red"><div class="grid-cell dot"></div></div>
    <div class="grid-cell c-red"><div class="grid-cell path-h"></div></div>
    <div class="grid-cell c-red"><div class="grid-cell path-h"></div></div>
    <div class="grid-cell c-blue"><div class="grid-cell dot"></div></div>
    <div class="grid-cell c-green"><div class="grid-cell dot"></div></div>
    <!-- Row 2 -->
    <div class="grid-cell c-red"><div class="grid-cell dot"></div></div>
    <div class="grid-cell c-yellow"><div class="grid-cell dot"></div></div>
    <div class="grid-cell c-yellow"><div class="grid-cell path-h"></div></div>
    <div class="grid-cell c-yellow"><div class="grid-cell dot"></div></div>
    <div class="grid-cell c-green"><div class="grid-cell path-v"></div></div>
    <!-- Row 3 -->
    <div class="grid-cell c-blue"><div class="grid-cell path-h"></div></div>
    <div class="grid-cell c-blue"><div class="grid-cell path-h"></div></div>
    <div class="grid-cell c-blue"><div class="grid-cell dot"></div></div>
    <div class="grid-cell"></div>
    <div class="grid-cell c-green"><div class="grid-cell dot"></div></div>
  </div>
  <div class="logo-title-1">COLORLINK <span class="five-hundred">500</span></div>
</div>

<!-- ==================== DESIGN 2 ==================== -->
<p class="design-label">Design 2 - Neon Glow</p>
<div class="logo-neon-container">
  <div class="neon-bg"></div>
  <div class="neon-line neon-line-1"></div>
  <div class="neon-line neon-line-2"></div>
  <div class="neon-line neon-line-3"></div>
  <div class="neon-line neon-line-4"></div>
  <div class="neon-dot neon-dot-1"></div>
  <div class="neon-dot neon-dot-2"></div>
  <div class="neon-dot neon-dot-3"></div>
  <div class="neon-dot neon-dot-4"></div>
  <div class="logo-title-2">
    <span class="color-part">COLOR</span><span class="link-part">LINK</span>
    <span class="num-part">500</span>
  </div>
</div>

<!-- ==================== DESIGN 3 ==================== -->
<p class="design-label">Design 3 - Chromatic Minimal</p>
<div class="logo-minimal-container">
  <div class="logo-icon-row">
    <div class="logo-icon-dot" style="background:#FF3B5C"></div>
    <div class="logo-icon-line" style="background:#FF3B5C"></div>
    <div class="logo-icon-dot" style="background:#FF3B5C"></div>
    <div style="width:12px"></div>
    <div class="logo-icon-dot" style="background:#3B8BFF"></div>
    <div class="logo-icon-line" style="background:#3B8BFF"></div>
    <div class="logo-icon-dot" style="background:#3B8BFF"></div>
    <div style="width:12px"></div>
    <div class="logo-icon-dot" style="background:#3BFF8B"></div>
    <div class="logo-icon-line" style="background:#3BFF8B"></div>
    <div class="logo-icon-dot" style="background:#3BFF8B"></div>
  </div>
  <div class="logo-title-3">
    <span class="c1">C</span><span class="c2">O</span><span class="c3">L</span><span class="c4">O</span><span class="c5">R</span><span class="c6">L</span><span class="c7">I</span><span class="c8">N</span><span class="c1">K</span>
  </div>
  <div class="logo-subtitle-3">500</div>
  <div class="tagline">Connect &middot; Solve &middot; Master</div>
</div>

<!-- ==================== DESIGN 4 ==================== -->
<p class="design-label">Design 4 - Dual Gradient</p>
<div class="logo-paths-container">
  <svg class="logo-paths-svg" viewBox="0 0 520 280">
    <!-- Decorative curved paths behind text -->
    <path d="M 30 60 Q 120 20, 200 80 T 400 50" stroke="#FF3B5C" stroke-width="3" fill="none" opacity="0.3"/>
    <path d="M 50 240 Q 180 200, 300 230 T 490 200" stroke="#3B8BFF" stroke-width="3" fill="none" opacity="0.3"/>
    <path d="M 20 150 Q 80 100, 140 150 T 260 130" stroke="#3BFF8B" stroke-width="3" fill="none" opacity="0.2"/>
    <path d="M 350 80 Q 400 120, 480 90" stroke="#FFD93B" stroke-width="3" fill="none" opacity="0.25"/>
    <!-- Endpoint dots -->
    <circle cx="30" cy="60" r="5" fill="#FF3B5C" opacity="0.6"/>
    <circle cx="400" cy="50" r="5" fill="#FF3B5C" opacity="0.6"/>
    <circle cx="50" cy="240" r="5" fill="#3B8BFF" opacity="0.6"/>
    <circle cx="490" cy="200" r="5" fill="#3B8BFF" opacity="0.6"/>
    <circle cx="20" cy="150" r="5" fill="#3BFF8B" opacity="0.5"/>
    <circle cx="260" cy="130" r="5" fill="#3BFF8B" opacity="0.5"/>
  </svg>
  <div class="logo-title-4">
    <span class="top-line">COLORLINK</span>
    <div class="sep-line"></div>
    <span class="bottom-line">500</span>
  </div>
</div>

</body>
</html>
