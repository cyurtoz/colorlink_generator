<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d2b"/>
      <stop offset="100%" style="stop-color:#12122e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF3B5C"/>
      <stop offset="25%" style="stop-color:#FFD93B"/>
      <stop offset="50%" style="stop-color:#3BFF8B"/>
      <stop offset="75%" style="stop-color:#3B8BFF"/>
      <stop offset="100%" style="stop-color:#C73BFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="128" y1="80" x2="128" y2="432"/>
    <line x1="208" y1="80" x2="208" y2="432"/>
    <line x1="288" y1="80" x2="288" y2="432"/>
    <line x1="368" y1="80" x2="368" y2="432"/>
    <line x1="80" y1="140" x2="432" y2="140"/>
    <line x1="80" y1="220" x2="432" y2="220"/>
    <line x1="80" y1="300" x2="432" y2="300"/>
    <line x1="80" y1="380" x2="432" y2="380"/>
  </g>

  <!-- Color paths (representing game connections) -->
  <g filter="url(#glow)">
    <!-- Red path: top-left to mid-right -->
    <path d="M 128 140 L 128 220 L 288 220" fill="none" stroke="#FF3B5C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <circle cx="128" cy="140" r="14" fill="#FF3B5C"/>
    <circle cx="288" cy="220" r="14" fill="#FF3B5C"/>

    <!-- Blue path: top-right to bottom-right -->
    <path d="M 368 140 L 368 300 L 368 380" fill="none" stroke="#3B8BFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <circle cx="368" cy="140" r="14" fill="#3B8BFF"/>
    <circle cx="368" cy="380" r="14" fill="#3B8BFF"/>

    <!-- Green path: mid-left to bottom-mid -->
    <path d="M 128 300 L 208 300 L 208 380" fill="none" stroke="#3BFF8B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <circle cx="128" cy="300" r="14" fill="#3BFF8B"/>
    <circle cx="208" cy="380" r="14" fill="#3BFF8B"/>

    <!-- Yellow path: top-mid to mid-mid -->
    <path d="M 208 140 L 208 220 L 208 220" fill="none" stroke="#FFD93B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <circle cx="208" cy="140" r="14" fill="#FFD93B"/>
    <circle cx="208" cy="220" r="14" fill="#FFD93B"/>

    <!-- Purple path: bottom-left to bottom-right area -->
    <path d="M 128 380 L 288 380 L 288 300" fill="none" stroke="#C73BFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <circle cx="128" cy="380" r="14" fill="#C73BFF"/>
    <circle cx="288" cy="300" r="14" fill="#C73BFF"/>
  </g>

  <!-- Text: CL 500 -->
  <text x="256" y="488" text-anchor="middle" font-family="'Orbitron', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="url(#textGrad)" letter-spacing="4" opacity="0.0">
    COLORLINK 500
  </text>
</svg>
